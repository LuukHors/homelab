homelab:
  deploy: true
  dnsResolverIp: 192.168.1.248
  products:
    argocd:
      deploy: true
      ignoreDifferences:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
    envoy-gateway:
      deploy: true
    ingress-nginx:
      deploy: false
    sealed-secrets:
      deploy: true
    external-dns:
      deploy: true
    private-external-dns:
      deploy: true
    cert-manager:
      deploy: true
    pihole:
      deploy: true
      ignoreDifferences:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
    cloudnative-postgres:
      deploy: true
    authentik:
      deploy: true
      ignoreDifferences:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jsonPointers:
        - /spec/parentRefs/0/group
        - /spec/parentRefs/0/kind
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
    longhorn:
      deploy: true
      ignoreDifferences:
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jsonPointers:
        - /spec/rules/0/backendRefs/0/group
        - /spec/rules/0/backendRefs/0/kind
        - /spec/rules/0/backendRefs/0/weight
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jqPathExpressions:
          - .spec.preserveUnknownFields
    sealeo-temp:
      deploy: false
    harbor:
      deploy: false
      ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jqPathExpressions:
          - .spec.volumeClaimTemplates[].apiVersion
          - .spec.volumeClaimTemplates[].kind
    cilium:
      deploy: true
    prometheus-crd:
      deploy: false
    prometheus:
      deploy: false
    gitea:
      deploy: false
      ignoreDifferences:
      - group: apps
        kind: StatefulSet
        jqPathExpressions:
          - .spec.volumeClaimTemplates[].apiVersion
          - .spec.volumeClaimTemplates[].kind
    descheduler:
      deploy: true
    rick-memes:
      deploy: true