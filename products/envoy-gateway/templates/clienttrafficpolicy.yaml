apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: enable-client-ip-detection
spec:
  clientIPDetection:
    directSourceIP: {}
  targetRefs:
    {{ range $name, $gateway := .Values.gateways }}
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $name }}
    {{ end }}