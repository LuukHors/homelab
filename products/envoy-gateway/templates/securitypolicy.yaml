{{- range $name, $gateway := .Values.gateways }}
{{- with $gateway.securityPolicy }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: security-policy-{{ $name }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway-{{ $name }}
{{- . | toYaml | nindent 2 }}
{{- end }}
{{- end }}