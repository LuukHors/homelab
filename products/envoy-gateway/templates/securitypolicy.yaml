{{- range $name, $gateway := .Values.gateways }}
{{- with $gateway.securityPolicy }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ $name }}-security-policy
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $name }}
{{- . | toYaml | nindent 2 }}
{{- end }}
{{- end }}