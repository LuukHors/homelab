gateway-helm:
  podDisruptionBudget:
    minAvailable: 1

  deployment:
    envoyGateway:
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
    replicas: 2

  config:
    envoyGateway:
      logging:
        level:
          default: warn
      extensionApis:
        enableBackend: true

defaultTlsCertificate:
  domains:
    - 'sealeo.io'
    - '*.sealeo.io'
    - '*.internal.sealeo.io'

additionalCertificates:
  - name: rick-memes-certificate
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: letsencrypt-dns
    domains:
      - 'rick-memes.nl'
      - '*.rick-memes.nl'
      - '*.internal.rick-memes.nl'

gateways:
  private:
    addresses:
      - 192.168.1.250
    serviceAddress: 192.168.1.250
    replicas: 2
    resources:
      requests:
        cpu: 75m
        memory: 150Mi
      limits:
        memory: 300Mi
  public:
    addresses:
      - 95.99.147.238
    serviceAddress: 192.168.1.249
    replicas: 2
    resources:
      requests:
        cpu: 75m
        memory: 150Mi
      limits:
        memory: 300Mi
    securityPolicy:
      authorization:
        defaultAction: Deny
        rules:
        - action: Allow
          principal:
            clientCIDRs:
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 108.162.192.0/18
            - 131.0.72.0/22
            - 141.101.64.0/18
            - 162.158.0.0/15
            - 172.64.0.0/13
            - 173.245.48.0/20
            - 188.114.96.0/20
            - 190.93.240.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17