argo-cd:
  global:
    revisionHistoryLimit: 0
    networkPolicy:
      create: true
    logging:
      format: json
      level: info
      
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true

  configs:
    cm:
      create: false
      exec.enabled: true
    secret:
      createSecret: true
    rbac:
      create: false
    params:
      server.insecure: true

  controller:
    replicas: 1
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 130m
        memory: 512Mi

    metrics:
      enabled: false
      serviceMonitor:
        enabled: false

  dex:
    enabled: false

  redis:
    enabled: true
    resources:
      limits:
        memory: 100Mi
      requests:
        cpu: 30m
        memory: 50Mi

  server:
    replicas: 2
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 70m
        memory: 128Mi
    httproute:
      enabled: true
      parentRefs:
        - name: envoy-gateway-private
          namespace: envoy-gateway
          sectionName: web-https
      hostnames:
        - 'argo.internal.sealeo.io'
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          timeouts:
            request: 5m
            backendRequest: 5m
    configEnabled: false
    rbacConfigCreate: false

  repoServer:
    replicas: 2
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi

    metrics:
      enabled: false
      serviceMonitor:
        enabled: false

  applicationSet:
    replicas: 0
    serviceAccount:
      create: false
      allowAnyNamespace: false
      
  notifications:
    enabled: false
