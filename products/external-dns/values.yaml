external-dns:
  global:
    security:
      allowInsecureImages: true
  image:
    registry: registry.k8s.io
    repository: external-dns/external-dns
    tag: v0.21.0
  sources:
    # - crd
    - service
    - ingress
    - gateway-httproute
    - gateway-tlsroute
    - gateway-udproute
    - gateway-tcproute
    - gateway-grpcroute

  provider: cloudflare

  extraArgs:
    exclude-target-net: 192.168.1.0/24

  validation:
    enabled: true

  cloudflare:
    secretName: "cloudflare-api-token"
    proxied: true

  domainFilters: []

  excludeDomains:
    - 'internal.sealeo.io'

  regexDomainFilter: ""
  regexDomainExclusion: ""

  dryRun: false
  policy: sync

  crd:
    create: false

  service:
    revisionHistoryLimit: 0
    enabled: true

  serviceAccount:
    create: true

  rbac:
    create: true

  pdb:
    create: true

  metrics:
    enabled: false
