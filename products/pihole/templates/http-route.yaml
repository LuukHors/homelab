{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ .Values.pihole.virtualHost | squote }}
  parentRefs: {{ .Values.httpRoute.parentRefs }}
  rules:
    - backendRefs:
      - kind: Service
        name: pihole-web
        port: 80
        weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}