database:
  clusterName: authentik-postgres
  replicas: 2
  size: 16Gi

authentik:
  global:
    revisionHistoryLimit: 0
    env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            key: secretKey
            name: authentik-secret
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            key: password
            name: authentik-postgres-app

  worker:
    replicas: 2

  server:
    replicas: 2
    env:
      - name: AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS
        value: '100.100.0.0/17,100.100.128.0/19'
    route:
      main:
        enabled: true
        https: true
        hostnames:
          - 'auth.internal.sealeo.io'
        parentRefs:
          - name: envoy-gateway-private
            namespace: envoy-gateway
            sectionName: web-https

  authentik:
    log_level: debug
    postgresql:
      host: "authentik-postgres-rw"
      name: "app"
      user: "app"
      port: 5432
    redis:
      host: "{{ .Release.Name }}-redis-master"

  redis:
    enabled: true
    architecture: standalone
    auth:
      enabled: false
    master:
      revisionHistoryLimit: 0
      persistence:
        size: 16Gi