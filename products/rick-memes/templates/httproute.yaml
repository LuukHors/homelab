apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rick-memes
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - rick-memes.sealeo.io
  parentRefs: 
    - name: envoy-gateway-public
      namespace: envoy-gateway
      sectionName: web-https
  rules:
    - backendRefs:
      - kind: Service
        name: rick-memes
        port: 3000
        weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /