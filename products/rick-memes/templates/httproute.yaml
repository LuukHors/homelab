{{ if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rick-memes
  namespace: {{ .Release.Namespace }}
spec:
  hostnames: {{ .Values.httpRoute.hostnames | toYaml | nindent 2 }}
  parentRefs: {{ .Values.httpRoute.parentRefs | toYaml | nindent 2 }} 
  rules: {{ .Values.httpRoute.rules | toYaml | nindent 2  }}    
{{- end }}