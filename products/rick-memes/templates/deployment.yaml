apiVersion: apps/v1
kind: Deployment
metadata:
  name: rick-memes
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: rick-memes
  template:
    metadata:
      labels:
        app: rick-memes
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: markbrouwer/rick-memes:1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: rick-memes-runtime
          env:
            - name: ACCESS_QUESTION
              value: "Wat is de naam van Rick zijn hond?"
            - name: UPLOAD_DIR
              value: /app/uploads
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rick-memes-app
                  key: uri
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 2000
            runAsGroup: 2000
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: rick-memes-uploads