apiVersion: batch/v1
kind: Job
metadata:
  name: rick-memes-migrate-v1-0-0
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: markbrouwer/rick-memes:1.0.0-migrate
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "db:migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rick-memes-app
                  key: uri